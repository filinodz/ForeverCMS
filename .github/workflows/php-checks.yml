name: PHP checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show PHP version
        run: php --version

      - name: Check studio JavaScript
        run: |
          node --check www/assets/js/admin/creator-studio.js
          node --check www/assets/js/admin/page-studio.js
          node --check www/assets/js/includes/header.js
          node --check www/assets/js/pages/character-viewer.js
          node --check www/assets/js/pages/players-online.js
          node --check www/assets/js/pages/live-map.js

      - name: Check portable configuration and roster
        run: |
          php tests/standalone-test.php
          php tests/secret-config-test.php
          php tests/join-guide-test.php
          php tests/armory-roster-test.php
          php tests/appearance-portability-test.php
          php tests/live-map-api-test.php
          node tests/players-online-test.cjs
          node tests/live-map-test.cjs

      - name: Check page sanitizer
        run: php tests/page_studio_test.php

      - name: Lint application PHP
        shell: bash
        run: >-
          find www -type f -name '*.php'
          -not -path 'www/vendor/*'
          -print0 | xargs -0 -n1 php -l

      - name: Reject local-only files
        shell: bash
        run: |
          test ! -e www/includes/config.secret.php
          test ! -e www/includes/config.database.php
          test ! -d setup/backups
          test ! -d logs
          test ! -d tmp

  repack-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repack integration without touching a server
        shell: powershell
        run: ./tests/repack-installer-test.ps1
